packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 reads `allowBuilds` (a map). pnpm 10 reads `onlyBuiltDependencies`
# (a list). Keep both so the file works on either major during the rollout.
allowBuilds:
  # @tailwindcss/oxide postinstall fetches the platform-specific Rust binary
  # used by the Tailwind v4 engine.
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  # core-js postinstall just prints a sponsor banner; safe to skip.
  core-js: false
  # esbuild postinstall fetches the platform-specific binary that next/vite use.
  esbuild: true
  # sharp ships native image-processing binaries that next/image loads.
  sharp: true
  # unrs-resolver downloads the platform-specific native binary used by
  # eslint-plugin-import and Next.js tooling for module resolution.
  unrs-resolver: true

minimumReleaseAgeExclude:
  - glob@10.5.0
  - zx@8.8.5
  - next@16.0.9
  - preact@10.28.2
  - next@16.1.5
  - next@16.0.11
  - tar@7.5.7
  - js-yaml@3.14.2
  - js-yaml@4.1.1
  - tar@7.5.3
  - tar@7.5.8
  - minimatch@3.1.3
  - minimatch@9.0.6
  - minimatch@9.0.7
  - minimatch@3.1.4
  - ajv@6.14.0
  - tar@7.5.10
  - tar@7.5.11
  - flatted@3.4.0
  - tar@7.5.4
  - next@16.1.7
  - flatted@3.4.2
  - brace-expansion@1.1.13
  - brace-expansion@2.0.3
  - picomatch@2.3.2
  - picomatch@4.0.4
  - yaml@2.8.3
  - next@16.2.3
  - protocol-buffers-schema@3.6.1
  - postcss@8.5.10
  - next@16.2.5
  - next@16.2.6
  - ws@8.20.1
  - turbo@2.9.14
  - tar@7.5.16
  - js-yaml@3.15.0
  - js-yaml@4.1.2
  - ws@8.21.0
  - '@babel/core@7.29.1'
  - brace-expansion@2.1.2
  - brace-expansion@1.1.16
  - js-yaml@4.3.0
  - tar@7.5.18
  - tar@7.5.19
  - tar@7.5.17
