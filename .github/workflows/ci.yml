name: CI

on:
  pull_request:
    branches: [main]

# Cancel superseded runs when new commits are pushed to the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: no job in this workflow writes to the repository.
permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  lint-and-typecheck:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Non-mutating lint: fail on violations instead of auto-fixing.
      - run: pnpm --filter vinho-web run lint:check
      - run: pnpm --filter vinho-web run typecheck
      - name: Security audit (high severity gate)
        run: pnpm audit --audit-level=high

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm --filter vinho-web run test -- --ci

  validate-migrations:
    name: Validate migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@d347ba47d3fb7eeeddbbc793bc8d4779caf773ea # v1.5.0
        with:
          version: 2.109.0
      # Non-essential services excluded to speed the boot.
      - name: Start local Supabase
        run: supabase start -x imgproxy,studio,vector,logflare
      - name: Verify migrations apply cleanly
        run: supabase db reset
      # The committed database.types.ts must match what the migrations build.
      # Generating from the LOCAL stack (not production) checks a schema-change
      # PR against its own migrations, not the pre-migration prod schema.
      - name: Verify committed types match the migrations
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts 2>/dev/null
          if ! diff -q apps/vinho-web/lib/database.types.ts /tmp/database.types.ts > /dev/null; then
            echo "::error::apps/vinho-web/lib/database.types.ts is stale. Run 'pnpm run supa:types' and commit the result."
            diff apps/vinho-web/lib/database.types.ts /tmp/database.types.ts | head -40
            exit 1
          fi
          echo "Committed types match the migration-built schema."
      - name: Stop local Supabase
        if: always()
        run: supabase stop

  integration-and-pgtap:
    name: Integration + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@d347ba47d3fb7eeeddbbc793bc8d4779caf773ea # v1.5.0
        with:
          version: 2.109.0
      - run: pnpm install --frozen-lockfile
      # Storage stays enabled (storage-policy pgTAP + upload integration need it).
      - name: Start local Supabase
        run: supabase start -x imgproxy,studio,vector,logflare
      - name: Apply migrations + seed
        run: supabase db reset
      # Database invariants: RLS enabled, write-scope, storage policies, the
      # SECURITY DEFINER lockdown, queue constraints, the repair function.
      - name: Run pgTAP database tests
        run: supabase test db
      - name: Run integration tests
        run: pnpm --filter vinho-web run test:integration -- --ci
      - name: Stop local Supabase
        if: always()
        run: supabase stop

  build:
    name: Build web app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter vinho-web run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@d347ba47d3fb7eeeddbbc793bc8d4779caf773ea # v1.5.0
        with:
          version: 2.109.0
      - run: pnpm install --frozen-lockfile
      # @playwright/test is intentionally not in the committed lockfile (keeps the
      # frozen-lockfile jobs lean); install it ephemerally here. Pinned to a version
      # well past the .npmrc minimum-release-age gate.
      - name: Install Playwright
        working-directory: apps/vinho-web
        run: |
          pnpm add -D @playwright/test@1.49.1
          pnpm exec playwright install --with-deps chromium
      - name: Start local Supabase
        run: supabase start -x imgproxy,studio,vector,logflare
      - name: Apply migrations + seed (creates the test user)
        run: supabase db reset
      - name: Capture local Supabase credentials
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status -o env | grep '^API_URL=' | cut -d'\"' -f2)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d'\"' -f2)" >> "$GITHUB_ENV"
      - name: Run Playwright e2e
        working-directory: apps/vinho-web
        env:
          CI: "true"
        run: pnpm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/vinho-web/playwright-report/
          retention-days: 7
      - name: Stop local Supabase
        if: always()
        run: supabase stop
